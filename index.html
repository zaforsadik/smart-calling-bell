<!DOCTYPE html>
<html>

<head>
  <title>Smart Calling Bell</title>

  <style>

    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
      background: #f2f2f2;
    }

    .box {
      width: 300px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    input, select {
      width: 90%;
      padding: 10px;
      margin: 10px;
    }

    button {
      padding: 12px 20px;
      background: red;
      color: white;
      border: none;
      cursor: pointer;
    }

  </style>
</head>

<body>

  <div class="box">

    <h2>Smart Calling Bell</h2>

    <select id="professor">
      <option>Dr. Rahman</option>
      <option>Dr. Ahmed</option>
      <option>Dr. Karim</option>
      <option>Dr. Hasan</option>
    </select>

    <input type="text" id="message" placeholder="Enter message">

    <button onclick="sendCall()">
      CALL ASSISTANT
    </button>

    <p id="status"></p>

  </div>

<script>

function sendCall() {

  let professor =
    document.getElementById("professor").value;

  let message =
    document.getElementById("message").value;

  fetch(
    "https://smart-calling-bell-6e6b8-default-rtdb.firebaseio.com/call.json",
    {
      method: "PUT",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        professor: professor,
        message: message,
        status: "new"
      })
    }
  )

  .then(response => response.json())

  .then(data => {

    document.getElementById("status").innerHTML =
      "Call Sent Successfully!";

    document.getElementById("message").value = "";
  })

  .catch(error => {

    document.getElementById("status").innerHTML =
      "Error sending call";

    console.log(error);
  });
}

</script>

</body>
</html>
